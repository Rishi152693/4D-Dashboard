<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Dashboard Hub</title>
<style>
:root{--bg:#eef3f2;--pn:#fff;--tx:#12302e;--mu:#5b7270;--ln:#d5e1de;--ac:#14b8a6;--hd:#0b2a3a;--bad:#dc2626;--good:#059669}
@media(prefers-color-scheme:dark){:root{--bg:#0d1b1f;--pn:#14272c;--tx:#e3f0ee;--mu:#93aeab;--ln:#27403f}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select{font:inherit;border:1px solid var(--ln);border-radius:8px;padding:7px 10px;background:var(--pn);color:var(--tx)}button{cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:#04302b;font-weight:700}button.d{color:var(--bad)}
header{background:linear-gradient(120deg,#0b2a3a,#0f4a52);color:#fff;padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}header h1{margin:0;font-size:16px;letter-spacing:.08em;flex:1}header button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
#login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#0f4a52,#0b2a3a 60%,#06161f);padding:16px}.lc{background:var(--pn);width:min(380px,100%);border-radius:14px;padding:26px;box-shadow:0 20px 60px #0008}.lc h2{margin:0 0 4px}.lc small{color:var(--mu)}.lc input{width:100%;margin:6px 0 12px}.lc button{width:100%;padding:10px}
.err{color:var(--bad);min-height:1.3em;font-size:13px}main{padding:16px 18px;max-width:1200px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}.card{background:var(--pn);border:1px solid var(--ln);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-3px);box-shadow:0 10px 26px #0003}
.card .im{height:150px;background:#0b2a3a center/cover;display:grid;place-items:center;color:#7ee0d4;font-size:34px}.card .b{padding:10px 12px}.card h3{margin:0 0 2px;font-size:15px}.card small{color:var(--mu);display:block}
.bar{height:6px;background:var(--ln);border-radius:4px;margin:8px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.box{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:14px}.box h3{margin:0 0 8px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.tag{padding:1px 8px;border-radius:99px;background:var(--ln);font-size:12px}.hide{display:none!important}label.c{display:inline-flex;gap:4px;align-items:center;margin-right:8px}
</style></head><body>
<div id=login class=hide><form class=lc id=lf><h2>Project Dashboard</h2><small>Sign in to continue</small><div style="height:14px"></div><label>User ID<input id=lid autocomplete=username autocapitalize=none required></label><label>Password<input id=lpw type=password autocomplete=current-password required></label><div class=err id=lerr></div><button class=p>Sign in</button></form></div>
<div id=chg class=hide style="min-height:100vh;display:grid;place-items:center;background:var(--bg);padding:16px"><form class=lc id=cf><h2>Set a new password</h2><small>You must change your temporary password.</small><div style="height:14px"></div><label>Current password<input id=cp1 type=password autocomplete=current-password required></label><label>New password (8+ characters)<input id=cp2 type=password autocomplete=new-password minlength=8 required></label><div class=err id=cerr></div><button class=p>Save password</button></form></div>
<div id=app class=hide><header><h1>PROJECT DASHBOARD HUB</h1><span id=who></span><button id=bAdm class=hide>Admin</button><button id=bHome class=hide>Projects</button><button id=bPw>Password</button><button id=bOut>Sign out</button></header>
<main id=gal></main><main id=adm class=hide></main></div>
<script src="/blob-client.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ME=null,PROJ=[],USERS=[];
const api=async(u,b)=>{const r=await fetch(u,b?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b),credentials:'same-origin'}:{credentials:'same-origin'});const j=await r.json().catch(()=>({error:'Bad response'}));if(!r.ok){const e=new Error(j.error||'Error');e.status=r.status;throw e}return j};
const show=id=>['login','chg','app'].forEach(x=>$('#'+x).classList.toggle('hide',x!==id));
async function boot(){const j=await api('/api/me');ME=j.user;if(!ME){show('login');return}if(ME.mustChange){show('chg');return}$('#who').textContent=ME.name+' ('+ME.role+')';$('#bAdm').classList.toggle('hide',ME.role!=='admin');show('app');home()}
$('#lf').onsubmit=async e=>{e.preventDefault();$('#lerr').textContent='';try{await api('/api/login',{id:$('#lid').value,password:$('#lpw').value});$('#lpw').value='';boot()}catch(er){$('#lerr').textContent=er.message}};
$('#cf').onsubmit=async e=>{e.preventDefault();$('#cerr').textContent='';try{await api('/api/password',{current:$('#cp1').value,next:$('#cp2').value});$('#cp1').value=$('#cp2').value='';boot()}catch(er){$('#cerr').textContent=er.message}};
$('#bOut').onclick=async()=>{await api('/api/logout',{});ME=null;show('login')};
$('#bPw').onclick=()=>{const c=prompt('Current password');if(!c)return;const n=prompt('New password (8+ characters)');if(!n)return;api('/api/password',{current:c,next:n}).then(()=>alert('Password changed')).catch(e=>alert(e.message))};
$('#bAdm').onclick=()=>{$('#gal').classList.add('hide');$('#adm').classList.remove('hide');$('#bHome').classList.remove('hide');$('#bAdm').classList.add('hide');admin()};
$('#bHome').onclick=()=>{$('#bHome').classList.add('hide');if(ME.role==='admin')$('#bAdm').classList.remove('hide');home()};
async function home(){$('#adm').classList.add('hide');$('#gal').classList.remove('hide');$('#gal').innerHTML='<p>Loading…</p>';PROJ=(await api('/api/projects')).projects;
if(!PROJ.length){$('#gal').innerHTML='<div class=box>No projects assigned to you yet.'+(ME.role==='admin'?' Open <b>Admin</b> to create one.':' Ask your administrator for access.')+'</div>';return}
$('#gal').innerHTML='<div class=grid>'+PROJ.map(p=>{const s=p.summary,pr=s?Math.round(s.progress*100):null;return `<div class=card onclick="location='/dashboard.html?p=${encodeURIComponent(p.id)}'"><div class=im style="${p.files&&p.files.hero?`background-image:url('/api/file?p=${encodeURIComponent(p.id)}&f=hero.jpg')`:''}">${p.files&&p.files.hero?'':'🏗'}</div><div class=b><h3>${esc(p.name)}</h3><small>${esc(p.client||'')}${p.location?' · 📍 '+esc(p.location.name):''}</small>${s?`<div class=bar><i style="width:${pr}%"></i></div><small>Actual ${pr}% · Planned ${Math.round(s.planned*100)}% · SPI ${s.spi.toFixed(2)} · Data date ${esc(s.dataDate)}</small>`:'<small>No schedule uploaded yet</small>'}</div></div>`}).join('')+'</div>'}
async function admin(){const [u,p]=await Promise.all([api('/api/users'),api('/api/projects')]);USERS=u.users;PROJ=p.projects;drawAdmin()}
function drawAdmin(){$('#adm').innerHTML=`<div class=box><h3>Projects</h3><table><tr><th>ID</th><th>Name</th><th>Client</th><th>Location</th><th>Data</th><th></th></tr>${PROJ.map(p=>`<tr><td>${esc(p.id)}</td><td>${esc(p.name)}</td><td>${esc(p.client)}</td><td>${p.location?esc(p.location.name)+' ('+p.location.lat+', '+p.location.lon+')':'–'}</td><td>${['model','gmeta','hero'].map(k=>`<span class=tag>${k==='model'?'schedule':k==='gmeta'?'3D':'image'}: ${p.files&&p.files[k]?'✓':'–'}</span>`).join(' ')}</td><td><button onclick="location='/dashboard.html?p=${encodeURIComponent(p.id)}'">Open</button> <button onclick="editP('${esc(p.id)}')">Edit</button> <button onclick="heroP('${esc(p.id)}')">Image</button> <button class=d onclick="delP('${esc(p.id)}')">Delete</button></td></tr>`).join('')}</table>
<h3 style="margin-top:14px">New project</h3><div class=row><input id=np_id placeholder="id (e.g. fdf-hq)"><input id=np_n placeholder="Project name"><input id=np_c placeholder="Client"><input id=np_by placeholder="Presented by"></div><div class=row><input id=np_ln placeholder="Location name (e.g. Abu Dhabi, UAE)"><input id=np_lat placeholder="Latitude" size=10><input id=np_lon placeholder="Longitude" size=10><button class=p onclick="newP()">Create project</button></div><div class=err id=perr></div></div>
<div class=box><h3>Users</h3><table><tr><th>ID</th><th>Name</th><th>Role</th><th>Projects</th><th>Status</th><th></th></tr>${USERS.map(u=>`<tr><td>${esc(u.id)}</td><td>${esc(u.name)}</td><td>${u.role}</td><td>${u.role==='admin'?'<small>all</small>':PROJ.map(p=>`<label class=c><input type=checkbox ${u.projects.includes(p.id)?'checked':''} onchange="toggleP('${esc(u.id)}','${esc(p.id)}',this.checked)">${esc(p.name)}</label>`).join('')||'<small>no projects</small>'}</td><td>${u.disabled?'<span class=tag style="color:var(--bad)">disabled</span>':'<span class=tag>active</span>'}${u.mustChange?' <span class=tag>must change pw</span>':''}</td><td><button onclick="resetU('${esc(u.id)}')">Reset password</button> <button onclick="disU('${esc(u.id)}',${!u.disabled})">${u.disabled?'Enable':'Disable'}</button> <button onclick="roleU('${esc(u.id)}','${u.role==='admin'?'viewer':'admin'}')">Make ${u.role==='admin'?'viewer':'admin'}</button> <button class=d onclick="delU('${esc(u.id)}')">Delete</button></td></tr>`).join('')}</table>
<h3 style="margin-top:14px">New user</h3><div class=row><input id=nu_id placeholder="User ID"><input id=nu_n placeholder="Name"><input id=nu_pw placeholder="Temporary password (8+)"><select id=nu_r><option value=viewer>viewer</option><option value=admin>admin</option></select><button class=p onclick="newU()">Create user</button></div><div class=err id=uerr></div><small>New users must change the temporary password at first sign-in. Tick projects in the table above to give access.</small></div>`}
const num=v=>v===''||isNaN(+v)?null:+v;
async function act(fn,errId){try{await fn();await admin()}catch(e){const el=$('#'+errId);if(el)el.textContent=e.message;else alert(e.message)}}
const newP=()=>act(()=>api('/api/projects',{action:'create',id:$('#np_id').value.trim().toLowerCase(),name:$('#np_n').value,client:$('#np_c').value,presentedBy:$('#np_by').value,location:{name:$('#np_ln').value,lat:num($('#np_lat').value),lon:num($('#np_lon').value)}}),'perr');
const editP=id=>{const p=PROJ.find(x=>x.id===id),n=prompt('Project name',p.name);if(n===null)return;const c=prompt('Client',p.client||'');const by=prompt('Presented by',p.presentedBy||'');const l=prompt('Location: name | latitude | longitude',p.location?`${p.location.name} | ${p.location.lat} | ${p.location.lon}`:'');const q=(l||'').split('|').map(s=>s.trim());act(()=>api('/api/projects',{action:'update',id,name:n,client:c,presentedBy:by,location:q.length===3?{name:q[0],lat:q[1],lon:q[2]}:null}))};
const delP=id=>confirm('Delete project '+id+' and all its data?')&&act(()=>api('/api/projects',{action:'delete',id}));
const newU=()=>act(()=>api('/api/users',{action:'create',id:$('#nu_id').value,name:$('#nu_n').value,password:$('#nu_pw').value,role:$('#nu_r').value,projects:[]}),'uerr');
const resetU=id=>{const p=prompt('New temporary password for '+id+' (8+ characters)');p&&act(()=>api('/api/users',{action:'reset',id,password:p}))};
const disU=(id,d)=>act(()=>api('/api/users',{action:'update',id,disabled:d})),roleU=(id,r)=>act(()=>api('/api/users',{action:'update',id,role:r}));
const delU=id=>confirm('Delete user '+id+'?')&&act(()=>api('/api/users',{action:'delete',id}));
const toggleP=(uid,pid,on)=>{const u=USERS.find(x=>x.id===uid),s=new Set(u.projects);on?s.add(pid):s.delete(pid);act(()=>api('/api/users',{action:'update',id:uid,projects:[...s]}))};
function heroP(id){const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=async()=>{const file=f.files[0];if(!file)return;try{const im=await createImageBitmap(file),k=Math.min(1,2400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.88));
await BlobClient.upload(`projects/${id}/hero.jpg`,blob,{access:'private',handleUploadUrl:'/api/upload',contentType:'image/jpeg'});await api('/api/projects',{action:'files',id,files:{hero:1}});alert('Image uploaded');admin()}catch(e){alert('Upload failed: '+e.message)}};f.click()}
boot();
</script></body></html>
